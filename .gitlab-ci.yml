include:
- template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  image: nixos/nix:latest

stages:
- test

test_core_functions:
  stage: test
  script:
    - nix-shell --run "python .venv/bin/pytest -n auto tests/test_checksum.py tests/test_clas_utils.py tests/test_dict_to_tree.py tests/test_dlc.py tests/test_function_namespace.py tests/test_framework.py tests/test_collection_name.py"

test_gdal_transform:
  stage: test
  script:
    - nix-shell --run "python .venv/bin/pytest -n auto tests/test_gdal_transform.py"

test_geometry:
  stage: test
  script:
    - nix-shell --run "python .venv/bin/pytest -n auto tests/geometry tests/test_geom_utils.py"

test_stac:
  stage: test
  script:
    - nix-shell --run "python .venv/bin/pytest -n auto tests/test_links.py tests/test_collection.py tests/test_item_examples.py tests/test_template_structure.py  tests/test_template_output.py"
  artifacts:
    when: on_failure
    name: test-stac-output
    paths:
      - test_collection_fail.json
      - test_item_examples_fail.json
      - test_template_output_fail.json
      - test_template_structure_fail.json
    expire_in: 1 week
